[project]
name = "yt-studio"
version = "0.1.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "I"]
ignore = ["SIM102", "SIM105", "SIM905", "B008", "B905"]

[tool.ruff.lint.per-file-ignores]
"studio/cli.py" = ["B008"]
